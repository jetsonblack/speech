<!DOCTYPE html>
<!--

                   formated with https://www.freeformatter.com/html-formatter.html
                   some css and html taken from past website for i308
   ___________________________________________________________________________
   -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Manage Speeches</title>
      <link rel="stylesheet" th:href="@{/css/styles.css}" />
   </head>
   <body>
      <main class="container">
         <header class="page-header">
            <div>
               <h1>Manage Speeches</h1>
            </div>
            <nav class="site-nav" aria-label="Primary">
               <a th:href="@{/}">Home</a>
               <a th:href="@{/admin}">Admin</a>
               <a th:href="@{/admin/speeches}" aria-current="page">Speeches</a>
               <form th:action="@{/logout}" method="post" style="display:inline;">
                  <button type="submit">Logout</button>
               </form>
            </nav>
         </header>
         <section class="panel">
            <p>
               <a th:href="@{/admin/speeches/new}">+ Create New Speech</a>
            </p>
            <div th:if="${#lists.isEmpty(speeches)}">
               <p>No speeches found.</p>
            </div>
            <div class="admin-table-wrap" th:if="${!#lists.isEmpty(speeches)}">
               <table class="admin-table">
                  <thead>
                     <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Person</th>
                        <th>Category</th>
                        <th>Audio</th>
                        <th>Actions</th>
                     </tr>
                  </thead>
                  <tbody>
                     <tr th:each="speech : ${speeches}">
                        <td th:text="${speech.id}">1</td>
                        <td>
                           <a th:href="@{/speech/{id}(id=${speech.id})}" th:text="${speech.title}">Speech Title</a>
                        </td>
                        <td th:text="${speech.person.name}">Person</td>
                        <td th:text="${speech.category.name}">Category</td>
                        <td th:text="${speech.audioUrl != null && !#strings.isEmpty(speech.audioUrl) ? 'Yes' : 'No'}">No</td>
                        <td>
                           <div class="admin-actions">
                              <a th:href="@{/admin/speeches/{id}/edit(id=${speech.id})}">Edit</a>
                              <form th:action="@{/admin/speeches/{id}/delete(id=${speech.id})}" method="post"
                                 onsubmit="return confirm('Delete this speech?');">
                                 <button type="submit">Delete</button>
                              </form>
                           </div>
                        </td>
                     </tr>
                  </tbody>
               </table>
            </div>
         </section>
      </main>
   </body>
</html>
